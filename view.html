<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="超市補貨 — 睇歷史同補貨建議（唔下單）" data-i18n-content="metaDescription" />
  <title data-i18n="appTitle">超市補貨</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    (function () {
      var lang = "zh-Hant";
      try {
        var stored = localStorage.getItem("grocery-restock-lang");
        if (stored === "en") lang = "en";
        else if (stored === "id") lang = "id";
      } catch (e) {}
      document.documentElement.lang = lang;
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1 data-i18n="appTitle">超市補貨</h1>
        <p class="tagline" data-i18n="tagline">睇歷史 · 睇建議 · 唔下單</p>
      </div>
      <div class="header-aside">
        <p class="updated" id="updatedAt" aria-live="polite" data-i18n="loading">載入緊…</p>
        <div class="lang-switch" id="langSwitch" role="group" data-i18n-aria="langLabel" aria-label="語言">
          <button type="button" data-lang="zh" lang="zh-Hant" aria-pressed="true" aria-label="中文">中</button>
          <button type="button" data-lang="en" lang="en" aria-pressed="false" aria-label="English">eng</button>
          <button type="button" data-lang="id" lang="id" aria-pressed="false" aria-label="Bahasa Indonesia">印</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="toolbar" aria-label="搜尋同篩選" data-i18n-aria="toolbarLabel">
      <div class="search-wrap">
        <label for="searchInput" class="sr-only" data-i18n="searchLabel">搜尋品名、牌子、類型或備註</label>
        <input
          type="search"
          id="searchInput"
          placeholder="搜尋品名／牌子／類型／備註…"
          data-i18n-placeholder="searchPlaceholder"
          autocomplete="off"
          enterkeyhint="search"
        />
      </div>
      <p id="exclusionNotice" class="notice" hidden role="status"></p>
      <div class="group-switch">
        <span class="filter-label" id="groupModeLabel" data-i18n="groupLabel">分組</span>
        <div class="segment" id="groupMode" role="group" aria-labelledby="groupModeLabel">
          <button type="button" data-group-mode="suggest-type" aria-pressed="true" data-i18n="groupSuggest">建議優先</button>
          <button type="button" data-group-mode="type-suggest" aria-pressed="false" data-i18n="groupType">類型優先</button>
        </div>
      </div>
      <div class="filters">
        <div class="filter-group">
          <span class="filter-label" id="suggestLabel" data-i18n="suggestLabel">建議</span>
          <div class="chip-row" role="group" aria-labelledby="suggestLabel" id="suggestFilters">
            <button type="button" class="chip is-active" data-suggest="all" aria-pressed="true" data-i18n="suggestAll">全部</button>
            <button type="button" class="chip chip-transit" data-suggest="在途" aria-pressed="false" data-i18n="suggestTransit">已下單</button>
            <button type="button" class="chip chip-priority" data-suggest="優先" aria-pressed="false" data-i18n="suggestPriority">優先</button>
            <button type="button" class="chip chip-hold" data-suggest="暫緩" aria-pressed="false" data-i18n="suggestHold">未使買住</button>
          </div>
        </div>
        <div class="filter-group">
          <label for="typeFilter" class="filter-label" data-i18n="typeLabel">類型</label>
          <select id="typeFilter" translate="no">
            <option value="all" data-i18n="typeAll">全部類型</option>
          </select>
        </div>
      </div>
      <div class="toolbar-actions">
        <button type="button" id="expandAll" class="text-btn" data-i18n="expandAll">全部展開</button>
        <button type="button" id="collapseAll" class="text-btn" data-i18n="collapseAll">全部摺疊</button>
        <p class="result-count" id="resultCount" aria-live="polite"></p>
      </div>
    </section>

    <div id="errorBox" class="error-box" hidden role="alert"></div>
    <div id="sections" class="sections" translate="no"></div>
    <p id="emptyState" class="empty-state" hidden data-i18n="emptyFilter">冇符合條件嘅項目。</p>
  </main>

  <footer class="site-footer">
    <p data-i18n="footer">公開建議工具 · 唔含私人資料 · 時間為香港時間（HKT） · 剔除同手動暫緩另存 Google Sheet</p>
  </footer>

  <script>
    window.GROCERY_READ_ONLY = true;
  </script>
  <script src="./config.js"></script>
  <script src="./app.js?v=20261015-2" defer></script>
</body>
</html>
