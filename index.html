<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="超市補貨 — 睇歷史同補貨建議（唔下單）" />
  <title>超市補貨</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1>超市補貨</h1>
        <p class="tagline">睇歷史 · 睇建議 · 唔下單</p>
      </div>
      <p class="updated" id="updatedAt" aria-live="polite">載入緊…</p>
    </div>
  </header>

  <main class="main">
    <section class="toolbar" aria-label="搜尋同篩選">
      <div class="search-wrap">
        <label for="searchInput" class="sr-only">搜尋品名、類型或備註</label>
        <input
          type="search"
          id="searchInput"
          placeholder="搜尋品名／類型／備註…"
          autocomplete="off"
          enterkeyhint="search"
        />
      </div>
      <div class="filters">
        <div class="filter-group">
          <span class="filter-label" id="suggestLabel">建議</span>
          <div class="chip-row" role="group" aria-labelledby="suggestLabel" id="suggestFilters">
            <button type="button" class="chip is-active" data-suggest="all" aria-pressed="true">全部</button>
            <button type="button" class="chip chip-priority" data-suggest="優先" aria-pressed="false">優先</button>
            <button type="button" class="chip chip-hold" data-suggest="暫緩" aria-pressed="false">暫緩</button>
            <button type="button" class="chip chip-transit" data-suggest="在途" aria-pressed="false">在途</button>
          </div>
        </div>
        <div class="filter-group">
          <label for="typeFilter" class="filter-label">類型</label>
          <select id="typeFilter">
            <option value="all">全部類型</option>
          </select>
        </div>
      </div>
      <div class="toolbar-actions">
        <button type="button" id="expandAll" class="text-btn">全部展開</button>
        <button type="button" id="collapseAll" class="text-btn">全部摺疊</button>
        <p class="result-count" id="resultCount" aria-live="polite"></p>
      </div>
    </section>

    <div id="errorBox" class="error-box" hidden role="alert"></div>
    <div id="sections" class="sections"></div>
    <p id="emptyState" class="empty-state" hidden>冇符合條件嘅項目。</p>
  </main>

  <footer class="site-footer">
    <p>公開建議工具 · 唔含私人資料 · 時間為香港時間（HKT）</p>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
